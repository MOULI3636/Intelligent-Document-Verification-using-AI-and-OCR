[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docvision-ai"
version = "1.0.0"
description = "Intelligent Document Verification, Multi-Engine OCR Benchmarking & Fraud Detection Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["computer-vision", "ocr", "document-ai", "fraud-detection", "deep-learning", "pytorch"]
authors = [
    { name = "DocVision AI Research Team", email = "research@docvision.ai" }
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "Pillow>=9.5.0",
    "albumentations>=1.3.1",
    "transformers>=4.30.0",
    "easyocr>=1.7.0",
    "torchmetrics>=1.0.0",
    "jiwer>=3.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0"
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
