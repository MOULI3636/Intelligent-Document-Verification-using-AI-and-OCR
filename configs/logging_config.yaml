# Production Logging Configuration for DocVision AI
# Loaded via logging.config.dictConfig for standardized console & file outputs.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "%(asctime)s | %(levelname)-8s | [%(process)d:%(threadName)s] | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/docvision.log
    maxBytes: 10485760 # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  DocVisionAI:
    level: DEBUG
    handlers: [console, file_handler]
    propagate: false

  APIService:
    level: INFO
    handlers: [console, file_handler]
    propagate: false

root:
  level: INFO
  handlers: [console, file_handler]
